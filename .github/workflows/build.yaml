name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  # Runs the Windows build as well, on request.
  workflow_dispatch:

jobs:
  linux:
    name: ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -o bin/ ./cmd/pdx-flag-builder

  # Compiling raylib and Dear ImGui with MinGW takes around ten minutes on the
  # hosted Windows runner, too long for every push. It runs when started by
  # hand, and every release builds and tests on Windows before publishing.
  windows:
    name: windows-latest
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -o bin/ ./cmd/pdx-flag-builder
